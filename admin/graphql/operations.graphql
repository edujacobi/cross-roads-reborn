query GetUserHistory($userId: ID!, $limit: Int, $offset: Int) {
	userHistory(userId: $userId, limit: $limit, offset: $offset) {
		total
		entries {
			id
			attackerId
			defenderId
			attacker {
				id
				nickname
				avatarUrl
			}
			defender {
				id
				nickname
				avatarUrl
			}
			locationId
			locationName
			type
			success
			money
			createdAt
		}
	}
}


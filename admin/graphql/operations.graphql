query GetDashboardStats {
	dashboardStats {
		date
		totalPlayers
		allUsers
		bankVaultValue
		casinoVaultValue
		totalGangs
		prisonCount
		hospitalCount
		jobCount
		scavengeCount
		casinoCount
		robberyCount
		beatUpCount
		idleCount
		englishCount
		portugueseCount
		spanishCount
	}
}

query GetDashboardHistory {
	dashboardHistory {
		id
		date
		totalPlayers
		allUsers
		totalGangs
		prisonCount
		hospitalCount
		jobCount
		scavengeCount
		casinoCount
		robberyCount
		beatUpCount
		idleCount
		englishCount
		portugueseCount
		spanishCount
	}
}

query SearchUsers($search: String, $limit: Int, $offset: Int) {
	users(search: $search, limit: $limit, offset: $offset) {
		total
		users {
			id
			nickname
			avatarUrl
			class
			isVip
			vipEternal
			situationId
			isDeveloper
			isModerator
			isHelper
			createdAt
			updatedAt
		}
	}
}

query GetUserDetail($id: ID!) {
	user(id: $id) {
		id
		nickname
		online
		money
		avatarUrl
		avatarDecoration
		specialCoin
		gang {
			id
			name
			imageUrl
			color
			level
			role
		}
		class
		className
		attack
		defense
		isVip
		vipEternal
		vipTime
		language
		isInHospital
		hospitalTime
		isInPrison
		prisonTime
		isWorking
		jobEndsIn
		isScavenging
		isWanted
		isInCasino
		investment {
			id
			name
			defense
			expiresAt
			nextPaymentValue
			henchmanEndsAt
		}
		situationId
		situationText
		voteCount
		activityStats {
			dailyMaxStreak
			dailyCurrentStreak
			hospitalCount
			hospitalTreatmentCount
			hospitalTreatmentSum
			prisonCount
			escapeCount
			prisonBriberySum
			prisonBriberyCount
			robberySuccessCount
			robberyFailureCount
			robberySuccessRobbedSum
			robberyBeingRobbedCount
			robberyBeingRobbedSum
			beatUpSuccessCount
			beatUpFailureCount
			beatUpBeatedUpCount
			casinoWinCount
			casinoLoseCount
			casinoWinSum
			casinoLoseSum
			almsReceivedSum
			almsReceivedCount
			almsGivenSum
			almsGivenCount
			scavengeFoundCount
			scavengeFailures
			scavengeHospitalizations
			scavengePrisonizations
			jobReceivedSum
			jobReceivedCount
			investmentProfit
			shopSpentSum
			shopSpentCount
		}
		items {
			id
			name
			type
			quantity
			skin
			remainingTime
		}
		badges {
			id
			name
			description
		}
		createdAt
		updatedAt
	}
}

mutation SetMoney($userId: ID!, $amount: Int!, $mode: SetMoneyMode!) {
	setMoney(userId: $userId, amount: $amount, mode: $mode) {
		success
		message
		user {
			id
			money
		}
	}
}

mutation CureUser($userId: ID!) {
	cureUser(userId: $userId) {
		success
		message
		user {
			id
			isInHospital
			hospitalTime
		}
	}
}

mutation FreeUser($userId: ID!) {
	freeUser(userId: $userId) {
		success
		message
		user {
			id
			isInPrison
			prisonTime
		}
	}
}

mutation ResetCooldown($userId: ID!, $cooldown: String!) {
	resetCooldown(userId: $userId, cooldown: $cooldown) {
		success
		message
	}
}

mutation RemoveAction($userId: ID!, $action: String!) {
	removeAction(userId: $userId, action: $action) {
		success
		message
	}
}

mutation SetItem($userId: ID!, $itemId: Int!, $mode: SetMoneyMode!, $hoursOrQuantity: Float!) {
	setItem(userId: $userId, itemId: $itemId, mode: $mode, hoursOrQuantity: $hoursOrQuantity) {
		success
		message
	}
}

mutation AddSpecialCoins($userId: ID!, $amount: Int!) {
	addSpecialCoins(userId: $userId, amount: $amount) {
		success
		message
	}
}

mutation SetClass($userId: ID!, $classId: Int!) {
	setClass(userId: $userId, classId: $classId) {
		success
		message
	}
}

mutation SetNickname($userId: ID!, $nickname: String!) {
	setNickname(userId: $userId, nickname: $nickname) {
		success
		message
	}
}

mutation SetVip($userId: ID!, $days: Int!) {
	setVip(userId: $userId, days: $days) {
		success
		message
	}
}

mutation KillUser($userId: ID!, $days: Int!) {
	killUser(userId: $userId, days: $days) {
		success
		message
	}
}

mutation AddBadge($userId: ID!, $badgeId: Int!) {
	addBadge(userId: $userId, badgeId: $badgeId) {
		success
		message
	}
}

mutation RemoveBadge($userId: ID!, $badgeId: Int!) {
	removeBadge(userId: $userId, badgeId: $badgeId) {
		success
		message
	}
}

mutation SwapUsers($firstUserId: ID!, $secondUserId: ID!) {
	swapUsers(firstUserId: $firstUserId, secondUserId: $secondUserId) {
		success
		message
	}
}

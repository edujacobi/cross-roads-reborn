}

query SearchUsers($search: String, $limit: Int, $offset: Int, $vipOnly: Boolean, $sortBy: String, $sortOrder: String) {
	users(search: $search, limit: $limit, offset: $offset, vipOnly: $vipOnly, sortBy: $sortBy, sortOrder: $sortOrder) {
		total
		users {
			id
			nickname
			avatarUrl
			avatarDecoration
			class
			isVip
			vipEternal
			vipTime
			situationId
			isDeveloper
			isModerator
			isHelper
			createdAt
			updatedAt
		}
	}
}

query GetTopUsers($ranking: UserRanking!, $limit: Int!, $offset: Int!) {
	topUsers(ranking: $ranking, limit: $limit, offset: $offset) {
		total
		entries {
			id
			nickname
			avatarUrl
			avatarDecoration
			gangName
			gangColor
			value
			count
		}
	}
}

query GetTopGangs($limit: Int!, $offset: Int!) {
	topGangs(limit: $limit, offset: $offset) {
		total
		currentUserGangId
		currentUserGangName
		currentUserGangColor
		entries {
			id
			name
			acronym
			imageUrl
			level
			experience
			memberRole
			color
		}
	}
}


query GetAdminAuditLogs($limit: Int, $offset: Int, $actionId: Int) {
	adminAuditLogs(limit: $limit, offset: $offset, actionId: $actionId) {
		entries {
			id
			adminId
			adminName
			adminAvatarUrl
			adminIpAddress
			adminDeviceType
			adminOperatingSystem
			adminBrowser
			actionId
			targetUserId
			targetUserName
			targetUserAvatarUrl
			targetSettingId
			previousValue
			newValue
			createdAt
		}
		total
	}
}


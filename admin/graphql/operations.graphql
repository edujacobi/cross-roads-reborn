query GetDashboardStats {
	dashboardStats {
		date
		totalPlayers
		allUsers
		bankVaultValue
		casinoVaultValue
		totalGangs
		prisonCount
		hospitalCount
		jobCount
		scavengeCount
		casinoCount
		robberyCount
		beatUpCount
		idleCount
		englishCount
		portugueseCount
		spanishCount
	}
}

query GetDashboardHistory {
	dashboardHistory {
		id
		date
		totalPlayers
		allUsers
		totalGangs
		prisonCount
		hospitalCount
		jobCount
		scavengeCount
		casinoCount
		robberyCount
		beatUpCount
		idleCount
		englishCount
		portugueseCount
		spanishCount
	}
}

query GetEvents {
	events {
		id
		type
		value
		periodStart
		periodEnd
		isActive
	}
}

query GetSeasonInfo {
	seasonInfo {
		number
		startDate
		endDate
		daysRemaining
		mainHeistAllowed
	}
}

mutation SetMainHeistAllowed($allowed: Boolean!) {
	setMainHeistAllowed(allowed: $allowed) {
		success
		message
	}
}

mutation CreateEvent($type: Int!, $value: Float!, $periodStart: String!, $periodEnd: String!) {
	createEvent(type: $type, value: $value, periodStart: $periodStart, periodEnd: $periodEnd) {
		success
		message
	}
}

mutation UpdateEvent($id: Int!, $value: Float, $periodStart: String, $periodEnd: String) {
	updateEvent(id: $id, value: $value, periodStart: $periodStart, periodEnd: $periodEnd) {
		success
		message
	}
}

mutation DeleteEvent($id: Int!) {
	deleteEvent(id: $id) {
		success
		message
	}
}

query SearchUsers($search: String, $limit: Int, $offset: Int) {
	users(search: $search, limit: $limit, offset: $offset) {
		total
		users {
			id
			nickname
			avatarUrl
			class
			isVip
			vipEternal
			situationId
			isDeveloper
			isModerator
			isHelper
			createdAt
			updatedAt
		}
	}
}

query GetTopUsers($ranking: UserRanking!, $limit: Int!, $offset: Int!) {
	topUsers(ranking: $ranking, limit: $limit, offset: $offset) {
		total
		entries {
			id
			nickname
			avatarUrl
			gangName
			gangColor
			value
			count
		}
	}
}

query GetTopGangs($limit: Int!, $offset: Int!) {
	topGangs(limit: $limit, offset: $offset) {
		total
		currentUserGangId
		currentUserGangName
		currentUserGangColor
		entries {
			id
			name
			acronym
			imageUrl
			level
			experience
			memberRole
			color
		}
	}
}

query GetUserDetail($id: ID!) {
	user(id: $id) {
		id
		nickname
		online
		money
		avatarUrl
		avatarDecoration
		specialCoin
		gang {
			id
			name
			imageUrl
			color
			level
			role
		}
		class
		className
		attack
		defense
		isVip
		vipEternal
		vipTime
		language
		isInHospital
		hospitalTime
		isInPrison
		prisonTime
		isWorking
		jobEndsIn
		isScavenging
		isWanted
		wantedTime
		isRobbing
		isBeingRobbed
		isBeating
		isBeingBeated
		isInCasino
		isDefendingInvestment
		isInGangAction
		isDead
		deadUntil
		investment {
			id
			name
			defense
			expiresAt
			nextPaymentValue
			henchmanEndsAt
		}
		situationId
		situationText
		voteCount
		activityStats {
			dailyMaxStreak
			dailyCurrentStreak
			hospitalCount
			hospitalTreatmentCount
			hospitalTreatmentSum
			prisonCount
			escapeCount
			prisonBriberySum
			prisonBriberyCount
			robberySuccessCount
			robberyFailureCount
			robberySuccessRobbedSum
			robberyBeingRobbedCount
			robberyBeingRobbedSum
			beatUpSuccessCount
			beatUpFailureCount
			beatUpBeatedUpCount
			casinoWinCount
			casinoLoseCount
			casinoWinSum
			casinoLoseSum
			almsReceivedSum
			almsReceivedCount
			almsGivenSum
			almsGivenCount
			scavengeFoundCount
			scavengeFailures
			scavengeHospitalizations
			scavengePrisonizations
			jobReceivedSum
			jobReceivedCount
			investmentProfit
			shopSpentSum
			shopSpentCount
		}
		items {
			id
			name
			type
			quantity
			skin
			remainingTime
		}
		badges {
			id
			name
			description
		}
		createdAt
		updatedAt
	}
}

mutation SetMoney($userId: ID!, $amount: Float!, $mode: SetMoneyMode!) {
	setMoney(userId: $userId, amount: $amount, mode: $mode) {
		success
		message
		user {
			id
			money
		}
	}
}

mutation CureUser($userId: ID!) {
	cureUser(userId: $userId) {
		success
		message
		user {
			id
			isInHospital
			hospitalTime
		}
	}
}

mutation FreeUser($userId: ID!) {
	freeUser(userId: $userId) {
		success
		message
		user {
			id
			isInPrison
			prisonTime
		}
	}
}

mutation ResetCooldown($userId: ID!, $cooldown: String!) {

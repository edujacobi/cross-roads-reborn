name: Web Deploy

on:
  workflow_dispatch:

concurrency: web-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: web-interface-prod
    defaults:
      run:
        working-directory: web-interface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-interface/package-lock.json

      - run: npm ci
      - run: echo "NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}" > .env.prod
      - run: npm run generate

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web-interface/.output/public/

      - name: Upload via rsync over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ vars.SSH_PORT }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          rsync -rz --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/id_deploy -p $SSH_PORT" \
            .output/public/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"

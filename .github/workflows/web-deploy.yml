name: Web Deploy

on:
  workflow_dispatch:

concurrency: web-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: web-interface-prod
    defaults:
      run:
        working-directory: web-interface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-interface/package-lock.json

      - run: npm ci
      - run: echo "NUXT_PUBLIC_API_BASE_URL=${{ vars.NUXT_PUBLIC_API_BASE_URL }}" > .env.prod
      - run: npm run generate

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: web-interface/.output/public/

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          local-dir: web-interface/.output/public/
          server-dir: ${{ vars.FTP_SERVER_DIR }}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="steel">
      <stop stop-color="#9da2a4"/>
      <stop offset=".13" stop-color="#d5d8d8"/>
      <stop offset=".28" stop-color="#b4b8b9"/>
      <stop offset=".46" stop-color="#e0e1e0"/>
      <stop offset=".64" stop-color="#a4a9aa"/>
      <stop offset=".8" stop-color="#cfd2d1"/>
      <stop offset="1" stop-color="#969c9d"/>
    </linearGradient>
    <filter id="brushing" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".008 .65" numOctaves="3" seed="12"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#steel)"/>
  <rect width="800" height="400" filter="url(#brushing)" opacity=".32"/>
</svg>
